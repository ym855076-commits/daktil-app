<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Красивый теплый градиент фона -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9966"/>
      <stop offset="100%" stop-color="#FF5E62"/>
    </linearGradient>
    
    <!-- Градиент для самой ладошки -->
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF0F0"/>
    </linearGradient>
    
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Закругленный фон приложения -->
  <rect width="512" height="512" rx="116" fill="url(#sunGrad)"/>

  <!-- Декоративные лучики/круги на фоне для уникальности -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="16" stroke-dasharray="12 12"/>

  <!-- Оригинальный силуэт дружелюбной ладони с тенью -->
  <g filter="url(#dropShadow)" fill="url(#handGrad)">
    <!-- Большой палец -->
    <path d="M140 270c-15 0-25-15-20-30 8-25 25-55 55-65 15-5 30 5 30 20s-10 25-25 35c-15 10-25 25-40 40z" />
    <!-- Указательный палец -->
    <path d="M175 180c0-16 12-28 28-28s28 12 28 28v90c-10-5-20-8-32-8s-22 3-24 8v-90z" />
    <!-- Средний палец -->
    <path d="M236 150c0-16 12-28 28-28s28 12 28 28v125c-10-3-20-5-32-5s-22 2-24 5V150z" />
    <!-- Безымянный палец -->
    <path d="M297 165c0-16 12-28 28-28s28 12 28 28v110c-10-3-20-5-32-5s-22 2-24 5v-110z" />
    <!-- Мизинец -->
    <path d="M358 190c0-14 11-25 25-25s25 11 25 25v80c-8 15-20 25-35 30-10 3-15-5-15-15v-95z" />
    <!-- Основание ладони -->
    <path d="M170 280h172c15 0 30 10 35 25 10 30 5 70-15 95-20 25-50 40-85 40s-65-15-85-40c-20-25-25-65-15-95 5-15 20-25 35-25z" />
  </g>
</svg>
